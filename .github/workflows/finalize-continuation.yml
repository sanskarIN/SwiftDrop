name: Finalize SwiftDrop continuation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/finalize-continuation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize final source and project metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8', newline='\n')

          # Ensure the receiver enforces aggregate batch validation/capacity even if an earlier one-time patch raced.
          p = Path('src/SwiftDrop.App/Services/ReceiveServerService.cs')
          text = read(p)
          if 'BatchManifestValidator.Validate(files, declaredTotal)' not in text:
              pattern = re.compile(
                  r'        if \(files is null \|\| files\.Count == 0 \|\| files\.Count > BatchTransferSourceBuilder\.MaxFilesPerBatch\)\n'
                  r'            throw new InvalidDataException\("Invalid batch file count\."\);\n\n'
                  r'        var safe = files\.Select\(ValidateAndSanitizeEntry\)\.ToArray\(\);\n'
                  r'        if \(safe\.Select\(x => x\.RelativePath\)\.Distinct\(StringComparer\.Ordinal\)\.Count\(\) != safe\.Length\)\n'
                  r'            throw new InvalidDataException\("Duplicate batch path\."\);\n'
                  r'        foreach \(var file in safe\) _ = PathGuard\.ResolveUnderRoot\(_receiveRoot, file\.RelativePath\);\n'
                  r'        var actualTotal = checked\(safe\.Sum\(x => x\.Length\)\);\n'
                  r'        if \(declaredTotal is null \|\| declaredTotal\.Value != actualTotal\)\n'
                  r'            throw new InvalidDataException\("Batch total size mismatch\."\);\n'
                  r'        return safe;')
              replacement = '''        var validated = BatchManifestValidator.Validate(files, declaredTotal);
              var safe = validated.Select(ValidateAndSanitizeEntry).ToArray();
              if (safe.Select(x => x.RelativePath).Distinct(StringComparer.Ordinal).Count() != safe.Length)
                  throw new InvalidDataException("Duplicate batch path after filename sanitation.");
              foreach (var file in safe) _ = PathGuard.ResolveUnderRoot(_receiveRoot, file.RelativePath);
              return safe;'''.replace('              ', '        ')
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('Could not safely normalize ReceiveServer batch validation.')

          if 'remainingBatchBytes = BatchCapacityPlanner.CalculateRemainingBytes' not in text:
              marker = '        await FrameProtocol.WriteJsonAsync(connection, new BatchTransferResponse(true, plans), ct);'
              if marker not in text:
                  raise SystemExit('Could not locate ReceiveServer batch negotiation response.')
              block = '''        var resumeOffsets = receiveItems.ToDictionary(
              x => x.EffectiveEntry.RelativePath,
              x => x.ResumeOffset,
              StringComparer.Ordinal);
          var remainingBatchBytes = BatchCapacityPlanner.CalculateRemainingBytes(
              receiveItems.Select(x => x.EffectiveEntry).ToArray(),
              resumeOffsets);
          var capacityProbePath = PathGuard.ResolveUnderRoot(
              _receiveRoot,
              receiveItems[0].EffectiveEntry.RelativePath);
          StorageCapacityGuard.EnsureCapacity(capacityProbePath, remainingBatchBytes);

          '''.replace('          ', '        ')
              text = text.replace(marker, block + marker, 1)
          write(p, text)

          # Android app data should remain outside normal application backup flows.
          p = Path('src/SwiftDrop.App/Platforms/Android/AndroidManifest.xml')
          text = read(p).replace('android:allowBackup="true"', 'android:allowBackup="false"')
          write(p, text)

          # Release-readiness should work even before/without a Git executable-mode normalization commit.
          p = Path('.github/workflows/release-readiness.yml')
          text = read(p).replace('./scripts/verify-core.sh', 'bash scripts/verify-core.sh')
          write(p, text)

          # Replace the original bootstrap .sln content with a conventional Visual Studio solution;
          # SwiftDrop.slnx remains the modern XML solution.
          sln = r'''Microsoft Visual Studio Solution File, Format Version 12.00
          # Visual Studio Version 17
          VisualStudioVersion = 17.0.31903.59
          MinimumVisualStudioVersion = 10.0.40219.1
          Project("{9A19103F-16F7-4668-BE54-9A1E7A4F7556}") = "SwiftDrop.Core", "src\SwiftDrop.Core\SwiftDrop.Core.csproj", "{15127BFA-5DFD-4DAF-8FA6-96688229A653}"
          EndProject
          Project("{9A19103F-16F7-4668-BE54-9A1E7A4F7556}") = "SwiftDrop.App", "src\SwiftDrop.App\SwiftDrop.App.csproj", "{8C578F3B-A0E7-498F-A6EB-3B1D34F9ABED}"
          EndProject
          Project("{9A19103F-16F7-4668-BE54-9A1E7A4F7556}") = "SwiftDrop.Core.Tests", "tests\SwiftDrop.Core.Tests\SwiftDrop.Core.Tests.csproj", "{51EFC432-C1C2-4C53-8A4E-EE443F7A1635}"
          EndProject
          Global
              GlobalSection(SolutionConfigurationPlatforms) = preSolution
                  Debug|Any CPU = Debug|Any CPU
                  Release|Any CPU = Release|Any CPU
              EndGlobalSection
              GlobalSection(ProjectConfigurationPlatforms) = postSolution
                  {15127BFA-5DFD-4DAF-8FA6-96688229A653}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
                  {15127BFA-5DFD-4DAF-8FA6-96688229A653}.Debug|Any CPU.Build.0 = Debug|Any CPU
                  {15127BFA-5DFD-4DAF-8FA6-96688229A653}.Release|Any CPU.ActiveCfg = Release|Any CPU
                  {15127BFA-5DFD-4DAF-8FA6-96688229A653}.Release|Any CPU.Build.0 = Release|Any CPU
                  {8C578F3B-A0E7-498F-A6EB-3B1D34F9ABED}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
                  {8C578F3B-A0E7-498F-A6EB-3B1D34F9ABED}.Debug|Any CPU.Build.0 = Debug|Any CPU
                  {8C578F3B-A0E7-498F-A6EB-3B1D34F9ABED}.Release|Any CPU.ActiveCfg = Release|Any CPU
                  {8C578F3B-A0E7-498F-A6EB-3B1D34F9ABED}.Release|Any CPU.Build.0 = Release|Any CPU
                  {51EFC432-C1C2-4C53-8A4E-EE443F7A1635}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
                  {51EFC432-C1C2-4C53-8A4E-EE443F7A1635}.Debug|Any CPU.Build.0 = Debug|Any CPU
                  {51EFC432-C1C2-4C53-8A4E-EE443F7A1635}.Release|Any CPU.ActiveCfg = Release|Any CPU
                  {51EFC432-C1C2-4C53-8A4E-EE443F7A1635}.Release|Any CPU.Build.0 = Release|Any CPU
              EndGlobalSection
          EndGlobal
          '''
          sln = '\n'.join(line[10:] if line.startswith('          ') else line for line in sln.splitlines()) + '\n'
          write('SwiftDrop.sln', sln)

          # Append final ledger data exactly once.
          ledger = Path('what_changed.md')
          ledger_text = read(ledger)
          marker = '## Finalization updates in this continuation'
          if marker not in ledger_text:
              ledger_text += '''

          ## Finalization updates in this continuation

          - Added strict reusable `BatchManifestValidator` and aggregate-limit tests.
          - Added `BatchCapacityPlanner` for validating resumable remaining-byte totals.
          - Wired receiver batch negotiation to shared aggregate manifest validation and cumulative capacity checking before payload streaming.
          - Hardened Android privacy by disabling normal application-data backup for SwiftDrop app data.
          - Added bounded Android share-sheet staging, original-filename preservation through per-share staging directories, failure cleanup, and recursive stale-cache pruning.
          - Added deterministic local-address selection support and Android multicast-lock support for nearby discovery.
          - Added protocol framing boundary/fuzz-style tests, explicit protocol compatibility tests, local-address policy tests, aggregate batch tests, database schema migration tests, filename sanitizer tests, and synthetic transfer self-tests.
          - Added versioned SQLite schema management for trust, history, and diagnostics metadata.
          - Added build reproducibility files (`global.json`, `.gitattributes`, `SwiftDrop.slnx`) and restored `SwiftDrop.sln` to conventional Visual Studio solution syntax.
          - Added Linux/PowerShell core verification scripts and ensured release-readiness invokes the shell script through `bash` so executable-bit differences cannot break the gate.
          - Added main-branch MAUI platform smoke builds, tag/manual release-readiness gates, CodeQL, Dependabot, and repository security-hygiene checks.
          - Added detailed wire-format, protocol compatibility, local database schema, platform integration, security testing, accessibility testing, clean-architecture, signing, store privacy/data-safety, and build documentation.
          - Added Android foreground data-sync lifetime for active user-initiated queued transfers and generic non-content-bearing foreground notification behavior.
          - Added Android inbound share-sheet handling and cross-platform `swiftdrop://` protocol activation routing.
          - Added History and Queue observable view models as the first application-wide MVVM migration surfaces.
          - Added English/Hindi localization resource catalogs and culture-aware localization infrastructure; full page-by-page resource migration remains a release-readiness item.
          - Added authoritative `BUILDING.md`, `NOTICE`, `SUPPORT.md`, `TERMS.md`, and `THIRD_PARTY_NOTICES.md` project files.

          ### Final verification boundary

          The repository now includes automated portable tests, CodeQL configuration, Android/Windows/Mac Catalyst compile workflows, release-readiness gates, and documented physical/manual matrices. Automated source/compile checks do not replace real-device validation, Apple/Google/Microsoft store signing, provisioning, notarization, firewall/router testing, or assistive-technology validation.

          The remaining platform-specific product gaps that are intentionally not misrepresented as complete are: a dedicated Apple inbound Share Extension, first-class desktop drag-and-drop, optional completion/failure notifications on every target, full page-by-page Hindi resource binding, and completion of the MVVM migration for the main/settings/devices/diagnostics orchestration surfaces. These do not weaken the implemented transport cryptography/integrity model, but they remain work before describing every master-prompt UX/integration item as production-validated.
          '''.replace('          ', '')
              write(ledger, ledger_text)

          # Remove one-time self-edit workflows after their guarded work has been normalized here.
          for path in [
              '.github/workflows/one-time-hardening.yml',
              '.github/workflows/one-time-platform-hardening.yml',
              '.github/workflows/fix-script-mode.yml',
          ]:
              p = Path(path)
              if p.exists(): p.unlink()

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify conventional and XML solutions resolve
        shell: bash
        run: |
          set -euo pipefail
          dotnet sln SwiftDrop.sln list
          dotnet sln SwiftDrop.slnx list

      - name: Verify portable core and tests
        shell: bash
        run: bash scripts/verify-core.sh

      - name: Verify Android app target
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install maui-android
          dotnet restore src/SwiftDrop.App/SwiftDrop.App.csproj -p:TargetFramework=net10.0-android
          dotnet build src/SwiftDrop.App/SwiftDrop.App.csproj -f net10.0-android -c Release --no-restore

      - name: Commit final verified continuation state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "Continuation finalization already present."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add -A
          git commit -m "chore: finalize verified SwiftDrop continuation" \
                     -m "Signed-off-by: Sanskar <sanskarin@outlook.in>"
          git push origin HEAD:main
