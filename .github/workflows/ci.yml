name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test Python validation helpers
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Validate documentation integrity
        run: python3 scripts/validate_documentation.py
      - name: Validate localization catalogs
        run: python3 scripts/validate_localization.py
      - name: Validate Apple integration metadata
        run: python3 scripts/validate_apple_integration.py
      - run: dotnet restore src/SwiftDrop.Core/SwiftDrop.Core.csproj
      - run: dotnet build src/SwiftDrop.Core/SwiftDrop.Core.csproj -c Release --no-restore
      - run: dotnet test tests/SwiftDrop.Core.Tests/SwiftDrop.Core.Tests.csproj -c Release
      - run: dotnet build benchmarks/SwiftDrop.Benchmarks/SwiftDrop.Benchmarks.csproj -c Release
      - name: Validate machine-readable vulnerability audit
        shell: bash
        run: |
          set -euo pipefail
          dotnet package list --project src/SwiftDrop.Core/SwiftDrop.Core.csproj --include-transitive --vulnerable --format json --output-version 1 > /tmp/core-vulnerabilities.json
          python3 scripts/validate_nuget_vulnerability_report.py /tmp/core-vulnerabilities.json

  windows-portable-verifier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run Windows portable verification
        shell: pwsh
        run: ./scripts/verify-core.ps1
