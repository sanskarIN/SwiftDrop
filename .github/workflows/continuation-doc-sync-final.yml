name: Continuation documentation sync final

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'continuation/state-machine-hardening-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: continuation/state-machine-hardening-20260818
          fetch-depth: 0
      - name: Execute structurally corrected documentation transformation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/continuation-doc-sync.yml').read_text(encoding='utf-8')
          block_start = source.index('          # Release process: update current counts and remove an exact duplicated section.\n')
          block_end = source.index('          # Engineering ledger: append; never rewrite historical sections.\n', block_start)
          replacement = (
              '          # Release process: update current counts and remove an exact duplicated section.\n'
              '          path = "docs/release/release-process.md"\n'
              '          text = read(path)\n'
              '          text = replace_once(text, "Updated: 2026-08-15", "Updated: 2026-08-18", path)\n'
              '          text = replace_once(text, "confirm the 16 Python helper tests and 522 xUnit tests pass;", "confirm the 26 Python helper tests and 572 xUnit tests pass;", path)\n'
              '          duplicate = (\n'
              '              "## Aggregate performance evidence\\n\\n"\n'
              '              "For a release candidate, treat the local trend CSV as reproducible **device evidence**, not as hosted telemetry. Generate it only from the exact signed candidate while exercising representative devices/networks. Retain the exported aggregate CSV with the candidate test record if project policy permits, and correlate it with the synthetic benchmark harness.\\n\\n"\n'
              '              "Before retaining or sharing any trend export, verify its schema is the aggregate-only five-column contract and contains no file/device/path/endpoint/authentication/content data. Hosted compile/test success validates implementation structure but does not substitute for physical measurement or store/privacy review.\\n\\n"\n'
              '          )\n'
              '          count = text.count(duplicate)\n'
              '          if count != 2:\n'
              '              raise SystemExit(f"{path}: expected duplicated aggregate section twice, found {count}")\n'
              '          first = text.find(duplicate)\n'
              '          second = text.find(duplicate, first + len(duplicate))\n'
              '          text = text[:second] + text[second + len(duplicate):]\n'
              '          write(path, text)\n\n'
          )
          source = source[:block_start] + replacement + source[block_end:]

          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n      - name: Commit synchronized documentation"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, 'continuation-doc-sync.py', 'exec'))
          PY
      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add README.md BUILDING.md NEXT_STEPS.md PROJECT_STATUS.md CHANGELOG.md docs/testing/ci-reference.md docs/release/release-process.md what_changed.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -s -m "docs(status): record state-machine hardening continuation"
          git push origin HEAD:continuation/state-machine-hardening-20260818
