name: Patch Hindi notification wording once

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-notification-hindi-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Make notification denial wording platform neutral
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/SwiftDrop.App/Resources/Strings/DialogStrings.hi.resx')
          text = path.read_text(encoding='utf-8')
          old = 'SwiftDrop वैकल्पिक पूर्ण/विफल नोटिफिकेशन के बिना भी सामान्य रूप से ट्रांसफ़र करेगा। आवश्यक foreground transfer status Android के प्लेटफ़ॉर्म नियमों द्वारा नियंत्रित होता है।'
          new = 'SwiftDrop वैकल्पिक पूर्ण/विफल नोटिफिकेशन के बिना भी सामान्य रूप से ट्रांसफ़र करेगा। किसी भी आवश्यक ट्रांसफ़र-स्थिति नोटिफिकेशन को ऑपरेटिंग सिस्टम अलग से नियंत्रित करता है।'
          if old not in text:
              raise SystemExit('Expected Hindi notification wording was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add src/SwiftDrop.App/Resources/Strings/DialogStrings.hi.resx
          git commit -s -m 'fix(localization): make Hindi notification denial platform neutral'
          git push origin HEAD:main
