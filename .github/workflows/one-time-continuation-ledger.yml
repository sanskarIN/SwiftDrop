name: One-time continuation ledger sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-continuation-ledger.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Synchronize continuation documentation
        run: python3 scripts/continuation_ledger_sync.py

      - name: Configure commit identity
        shell: bash
        run: |
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'

      - name: Commit release checklist command synchronization
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs/release/release-checklist.md; then
            git add docs/release/release-checklist.md
            git commit -s -m 'docs(release): use current .NET package audit command'
          fi

      - name: Commit synchronized project status
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- PROJECT_STATUS.md; then
            git add PROJECT_STATUS.md
            git commit -s -m 'docs(status): record continuation hardening evidence'
          fi

      - name: Commit changelog continuation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -s -m 'docs(changelog): record action and audit hardening'
          fi

      - name: Commit engineering ledger continuation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- what_changed.md; then
            git add what_changed.md
            git commit -s -m 'docs(ledger): append August 14 continuation'
          fi

      - name: Push synchronized documentation
        run: git push origin HEAD:main
