name: Continuation documentation sync corrected

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'continuation/state-machine-hardening-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: continuation/state-machine-hardening-20260818
          fetch-depth: 0
      - name: Execute corrected documentation transformation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/continuation-doc-sync.yml').read_text(encoding='utf-8')
          broken = "review.\\n\\n\"\n          count = text.count(duplicate)"
          fixed = "review.\\n\\n\"\"\"\n          count = text.count(duplicate)"
          if source.count(broken) != 1:
              raise SystemExit(f'expected one malformed duplicate-section terminator, found {source.count(broken)}')
          source = source.replace(broken, fixed, 1)
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n      - name: Commit synchronized documentation"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, 'continuation-doc-sync.py', 'exec'))
          PY
      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add README.md BUILDING.md NEXT_STEPS.md PROJECT_STATUS.md CHANGELOG.md docs/testing/ci-reference.md docs/release/release-process.md what_changed.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -s -m "docs(status): record state-machine hardening continuation"
          git push origin HEAD:continuation/state-machine-hardening-20260818
