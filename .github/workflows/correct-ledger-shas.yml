name: Correct final ledger commit SHAs

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-ledger-sha-trigger

permissions:
  contents: write

jobs:
  correct-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Correct blob references to Git commit SHAs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("what_changed.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "3e7dd988bd50613b5781863219811394730dc8f4": "8209b13c84d481dcd8b9fa7934e9f5772d384658",
              "9f2e76f13188e6139173cc7b85be87ac5100ad40": "bc04419ac2c0c90929fb5ad2deb3da2f31e43a1b",
              "cdcc0fd7dc783264bb1baa102011be67a31108f8": "f1e6f9593aae3a598e36f91b181b21066a5e9565",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          release_line = "- the release-process update made the exact same v4 queue requirements part of candidate freeze, physical validation, accessibility, and privacy review."
          replacement_line = "- `fe0b73022ccc8a66585c5a07b34c6ebef9556b7f` — release process made the same v4 queue requirements part of candidate freeze, physical validation, accessibility, and privacy review."
          text = text.replace(release_line, replacement_line)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit corrected ledger references
        shell: bash
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add what_changed.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -s -m "docs(ledger): correct final commit references"
          git push origin HEAD:main
