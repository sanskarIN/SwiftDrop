name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 3 * * 3'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/SwiftDrop.Core/SwiftDrop.Core.csproj
      - run: dotnet build src/SwiftDrop.Core/SwiftDrop.Core.csproj -c Release --no-restore
      - uses: github/codeql-action/analyze@v4
