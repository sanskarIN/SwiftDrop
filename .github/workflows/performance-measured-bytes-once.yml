name: Performance measured bytes once

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-performance-measured-bytes-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Patch outgoing measured bytes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/SwiftDrop.App/MainPage.xaml.cs')
          s = p.read_text()
          def one(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one outgoing match, found {count}: {old[:100]!r}')
              s = s.replace(old, new)
          one('''            await _transfers.SendAsync(\n                remote,\n                info.FullName,\n                new Progress<double>(x => _viewModel.TransferProgress = x),\n                _singleCts.Token);\n''', '''            var sendResult = await _transfers.SendAsync(\n                remote,\n                info.FullName,\n                new Progress<double>(x => _viewModel.TransferProgress = x),\n                _singleCts.Token);\n''')
          one('''            await _history.AddAsync("sent", remote.DeviceName, info.Name, info.Length, "completed", true, duration: stopwatch.Elapsed);\n''', '''            await _history.AddAsync(\n                "sent",\n                remote.DeviceName,\n                info.Name,\n                info.Length,\n                "completed",\n                true,\n                duration: stopwatch.Elapsed,\n                measuredBytes: sendResult.TransferredBytes);\n''')
          one('''                "completed",\n                false,\n                duration: textStopwatch.Elapsed);\n            TextSnippetEditor.Text = string.Empty;\n''', '''                "completed",\n                false,\n                duration: textStopwatch.Elapsed,\n                measuredBytes: Encoding.UTF8.GetByteCount(text));\n            TextSnippetEditor.Text = string.Empty;\n''')
          p.write_text(s)
      - name: Commit outgoing measured bytes
        run: |
          git add src/SwiftDrop.App/MainPage.xaml.cs
          git commit -m "fix(performance): attribute outgoing measured bytes" -m "Signed-off-by: Sanskar <sanskarin@outlook.in>"
      - name: Patch incoming measured bytes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/SwiftDrop.App/Services/ReceiveServerService.cs')
          s = p.read_text()
          def one(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one receive match, found {count}: {old[:100]!r}')
              s = s.replace(old, new)
          one('''    private readonly Func<IncomingTransferPreview, string, bool, TimeSpan?, CancellationToken, Task>? _recordTransfer;\n''', '''    private readonly Func<IncomingTransferPreview, string, bool, TimeSpan?, long?, CancellationToken, Task>? _recordTransfer;\n''')
          one('''        Func<IncomingTransferPreview, string, bool, TimeSpan?, CancellationToken, Task>? recordTransfer = null,\n''', '''        Func<IncomingTransferPreview, string, bool, TimeSpan?, long?, CancellationToken, Task>? recordTransfer = null,\n''')
          one('''                await RecordAsync(filePreview with { Entry = effectiveEntry }, "completed", true, ct, transferStopwatch.Elapsed);\n''', '''                await RecordAsync(\n                    filePreview with { Entry = effectiveEntry },\n                    "completed",\n                    true,\n                    ct,\n                    transferStopwatch.Elapsed,\n                    effectiveEntry.Length - offset);\n''')
          one('''                    await RecordAsync(itemPreview, "completed", true, ct, itemStopwatch.Elapsed);\n''', '''                    await RecordAsync(\n                        itemPreview,\n                        "completed",\n                        true,\n                        ct,\n                        itemStopwatch.Elapsed,\n                        item.EffectiveEntry.Length - item.ResumeOffset);\n''')
          one('''        CancellationToken ct,\n        TimeSpan? duration = null)\n        => _recordTransfer?.Invoke(preview, status, verified, duration, ct) ?? Task.CompletedTask;\n''', '''        CancellationToken ct,\n        TimeSpan? duration = null,\n        long? measuredBytes = null)\n        => _recordTransfer?.Invoke(preview, status, verified, duration, measuredBytes, ct) ?? Task.CompletedTask;\n''')
          p.write_text(s)

          p = Path('src/SwiftDrop.App/MainPage.xaml.cs')
          s = p.read_text()
          old = '''    private Task RecordIncomingAsync(\n        IncomingTransferPreview preview,\n        string status,\n        bool verified,\n        TimeSpan? duration,\n        CancellationToken ct)\n        => _history.AddAsync(\n            "received",\n            preview.SenderDeviceName,\n            preview.Entry.RelativePath,\n            preview.Entry.Length,\n            status,\n            verified,\n            ct,\n            duration);\n'''
          new = '''    private Task RecordIncomingAsync(\n        IncomingTransferPreview preview,\n        string status,\n        bool verified,\n        TimeSpan? duration,\n        long? measuredBytes,\n        CancellationToken ct)\n        => _history.AddAsync(\n            "received",\n            preview.SenderDeviceName,\n            preview.Entry.RelativePath,\n            preview.Entry.Length,\n            status,\n            verified,\n            ct,\n            duration,\n            measuredBytes);\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one incoming callback match, found {s.count(old)}')
          p.write_text(s.replace(old, new))
      - name: Commit incoming measured bytes
        run: |
          git add src/SwiftDrop.App/MainPage.xaml.cs src/SwiftDrop.App/Services/ReceiveServerService.cs
          git commit -m "fix(performance): attribute incoming measured bytes" -m "Signed-off-by: Sanskar <sanskarin@outlook.in>"
      - name: Push focused commits
        run: git push origin HEAD:main
