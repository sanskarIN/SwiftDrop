name: Platform builds

on:
  push:
    branches: [ main ]
    paths:
      - 'src/SwiftDrop.App/**'
      - 'src/SwiftDrop.Core/**'
      - 'Directory.Build.props'
      - '.github/workflows/platform-builds.yml'
  pull_request:
    paths:
      - 'src/SwiftDrop.App/**'
      - 'src/SwiftDrop.Core/**'
      - 'Directory.Build.props'
      - '.github/workflows/platform-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui-android
      - run: dotnet restore src/SwiftDrop.App/SwiftDrop.App.csproj -p:TargetFramework=net10.0-android
      - run: dotnet build src/SwiftDrop.App/SwiftDrop.App.csproj -f net10.0-android -c Release --no-restore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui-windows
      - run: dotnet restore src/SwiftDrop.App/SwiftDrop.App.csproj -p:TargetFramework=net10.0-windows10.0.19041.0
      - run: dotnet build src/SwiftDrop.App/SwiftDrop.App.csproj -f net10.0-windows10.0.19041.0 -c Release --no-restore

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui-ios maui-maccatalyst
      - run: dotnet restore src/SwiftDrop.App/SwiftDrop.App.csproj -p:TargetFramework=net10.0-maccatalyst
      - run: dotnet build src/SwiftDrop.App/SwiftDrop.App.csproj -f net10.0-maccatalyst -c Release --no-restore
      - name: Select iOS simulator runtime
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            echo "IOS_SIMULATOR_RID=iossimulator-arm64" >> "$GITHUB_ENV"
          else
            echo "IOS_SIMULATOR_RID=iossimulator-x64" >> "$GITHUB_ENV"
          fi
      - name: Restore iOS simulator target
        shell: bash
        run: dotnet restore src/SwiftDrop.App/SwiftDrop.App.csproj -p:TargetFramework=net10.0-ios -p:RuntimeIdentifier="$IOS_SIMULATOR_RID"
      - name: Build iOS simulator target
        shell: bash
        run: dotnet build src/SwiftDrop.App/SwiftDrop.App.csproj -f net10.0-ios -c Release --no-restore -p:RuntimeIdentifier="$IOS_SIMULATOR_RID"
