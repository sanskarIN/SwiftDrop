name: Continuation documentation sync

on:
  push:
    branches:
      - continuation/state-machine-hardening-20260818
    paths:
      - .github/workflows/continuation-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: continuation/state-machine-hardening-20260818
          fetch-depth: 0
      - name: Synchronize current-state documentation and append ledger
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one occurrence, found {count}")
              return text.replace(old, new, 1)

          # README current contract.
          path = "README.md"
          text = read(path)
          text = replace_once(
              text,
              "- concurrent bounded-state admission for rate-limiter peer keys and one-time authorization nonces;\n",
              "- concurrent bounded-state admission for rate-limiter peer keys and one-time authorization nonces;\n"
              "- deterministic seeded reference-model state machines for rate-limiter window/reset/capacity behavior, one-time authorization register/consume/prune/clear behavior, and discovery upsert/expiry/snapshot/clear behavior;\n",
              path,
          )
          text = replace_once(text, "currently covering **569 xUnit tests**", "currently covering **572 xUnit tests**", path)
          write(path, text)

          # Building guide current portable contract.
          path = "BUILDING.md"
          text = read(path)
          text = replace_once(text, "Updated: 2026-08-15", "Updated: 2026-08-18", path)
          text = replace_once(text, "**569 xUnit tests**", "**572 xUnit tests**", path)
          old = "The maintained portable verifier currently runs **26 Python helper tests** and **572 xUnit tests**. In addition to the aggregate History performance-trend/export contract, the final regression set covers resume side-effect boundaries, regular-file staging enforcement, exact one-time credential expiry, bounded concurrent security-state admission, discovery expiry, and strict mDNS RDATA isolation."
          new = old + " The August 18 continuation adds deterministic seeded reference-model state machines for the attempt rate limiter, one-time authorization store, and discovery registry without adding a new test dependency or changing runtime source."
          text = replace_once(text, old, new, path)
          write(path, text)

          # Roadmap: record the completed tranche while retaining future optional hardening.
          path = "NEXT_STEPS.md"
          text = read(path)
          text = replace_once(text, "Updated: 2026-08-15", "Updated: 2026-08-18", path)
          text = replace_once(text, "Portable regression coverage is **569 xUnit tests** plus **26 Python helper tests**.", "Portable regression coverage is **572 xUnit tests** plus **26 Python helper tests**.", path)
          marker = "Updated: 2026-08-18\n\n"
          section = """## August 18 deterministic state-machine hardening\n\n- Added deterministic reference-model state-machine regression suites for `AttemptRateLimiter`, `OneTimeAuthorizationStore`, and `DiscoveryRegistry`.\n- The suites execute **12,000 seeded generated operations** in total: 5,000 rate-limiter operations, 4,000 authorization-store operations, and 3,000 discovery-registry operations.\n- The reference models cover expiry boundaries, bounded admission, duplicate rejection, reset/prune/clear behavior, one-time consumption, invalid discovery inputs, trusted-first snapshot ordering, and self-exclusion.\n- Portable xUnit coverage is now **572 tests** while the Python helper suite remains **26 tests**.\n- This tranche changes test/documentation coverage only; no application/runtime source behavior is changed.\n- Signed-package, real-device/provider/network/filesystem, accessibility/localization, exact signed-artifact dependency/license/provenance, Apple provisioning/notarization, Windows packaged activation, and store/privacy validation remain external release work.\n\n"
          if section not in text:
              text = replace_once(text, marker, marker + section, path)
          text = replace_once(
              text,
              "- additional property/fuzz/state-machine testing beyond current coverage.",
              "- further property/fuzz/state-machine hardening can continue opportunistically; the August 18 tranche added deterministic reference-model coverage for the attempt rate limiter, one-time authorization store, and discovery registry.",
              path,
          )
          write(path, text)

          # Project status: current snapshot only; historical evidence below remains untouched.
          path = "PROJECT_STATUS.md"
          text = read(path)
          text = replace_once(text, "Updated: 2026-08-15", "Updated: 2026-08-18", path)
          text = replace_once(text, "Portable verification is **569/569 xUnit tests** plus **26/26 Python helper tests**", "Portable verification is **572/572 xUnit tests** plus **26/26 Python helper tests**", path)
          marker = "Updated: 2026-08-18\n\n"
          section = """## August 18 deterministic state-machine hardening snapshot\n\n- Added three seeded reference-model state-machine regressions covering the bounded attempt rate limiter, one-time authorization store, and discovery registry.\n- The combined generated sequence count is **12,000 operations**, with every subject result compared against an intentionally simple reference model after each relevant transition.\n- Release-readiness portable verification on test head `898f17a3157ab7af14d7aeb958b315dde1e1c2af` passed **572/572 xUnit tests**, **26/26 Python helper tests**, documentation/localization/Apple/Windows integration validation, Core and benchmark Release builds, and machine-readable vulnerable-package validation with zero findings.\n- Normal CI run `32126274113`, CodeQL run `32126274127`, and security-hygiene run `32126274092` completed successfully for the same test head.\n- No runtime application source changed in this tranche; remaining production work is still the signed/package/device/network/provider/accessibility/store evidence documented below.\n\n"
          if section not in text:
              text = replace_once(text, marker, marker + section, path)
          write(path, text)

          # Changelog: append a new current date without rewriting August 15 history.
          path = "CHANGELOG.md"
          text = read(path)
          marker = "# Changelog\n\n"
          section = """## Unreleased - 2026-08-18\n\n### Deterministic state-machine regression hardening\n\n- Added a 5,000-operation seeded reference-model state machine for `AttemptRateLimiter`, covering sliding-window expiry, bounded first-seen key admission, independent keys, rejection, and reset behavior.\n- Added a 4,000-operation seeded reference-model state machine for `OneTimeAuthorizationStore`, covering register/consume/prune/clear transitions, exact expiry, duplicate/capacity rejection, and count invariants.\n- Added a 3,000-operation seeded reference-model state machine for `DiscoveryRegistry`, covering valid/invalid upserts, exact expiry, snapshots, exclusion, ordering, and clear behavior.\n- Expanded the portable xUnit contract from **569 to 572 tests** without adding a third-party test dependency or changing application/runtime source.\n- Normal CI, CodeQL, and security-hygiene completed successfully on the test head; release-readiness portable Core/tests plus Android and focused Windows compile/audit jobs also passed while the Apple job continued through its hosted simulator compile sequence.\n- Synchronized current-state documentation to the 572/26 contract and removed a duplicated aggregate-performance-evidence section plus obsolete notification-era test counts from the release process.\n\n"
          if section not in text:
              text = replace_once(text, marker, marker + section, path)
          write(path, text)

          # CI reference current contract.
          path = "docs/testing/ci-reference.md"
          text = read(path)
          text = replace_once(text, "Updated: 2026-08-15", "Updated: 2026-08-18", path)
          text = replace_once(text, "**569 xUnit tests**", "**572 xUnit tests**", path)
          old = "The Core suite additionally covers daily bucketing/resume-safe measured-byte math plus the final hardening regressions for resume filesystem side effects, external source-link staging, exact one-time credential/discovery expiry, bounded concurrent security-state admission, and mDNS record-boundary parsing."
          new = old + " It also includes deterministic seeded reference-model state machines for rate-limiter, one-time authorization, and discovery-registry transitions."
          text = replace_once(text, old, new, path)
          write(path, text)

          # Release process: update current counts and remove an exact duplicated section.
          path = "docs/release/release-process.md"
          text = read(path)
          text = replace_once(text, "Updated: 2026-08-15", "Updated: 2026-08-18", path)
          text = replace_once(text, "confirm the 16 Python helper tests and 522 xUnit tests pass;", "confirm the 26 Python helper tests and 572 xUnit tests pass;", path)
          duplicate = """## Aggregate performance evidence\n\nFor a release candidate, treat the local trend CSV as reproducible **device evidence**, not as hosted telemetry. Generate it only from the exact signed candidate while exercising representative devices/networks. Retain the exported aggregate CSV with the candidate test record if project policy permits, and correlate it with the synthetic benchmark harness.\n\nBefore retaining or sharing any trend export, verify its schema is the aggregate-only five-column contract and contains no file/device/path/endpoint/authentication/content data. Hosted compile/test success validates implementation structure but does not substitute for physical measurement or store/privacy review.\n\n"
          count = text.count(duplicate)
          if count != 2:
              raise SystemExit(f"{path}: expected duplicated aggregate section twice, found {count}")
          first = text.find(duplicate)
          second = text.find(duplicate, first + len(duplicate))
          text = text[:second] + text[second + len(duplicate):]
          write(path, text)

          # Engineering ledger: append; never rewrite historical sections.
          path = "what_changed.md"
          text = read(path)
          if "## 198. Deterministic reference-model state-machine hardening" not in text:
              appendix = """\n\n## 198. Deterministic reference-model state-machine hardening\n\nThe next repository-executable post-v1 hardening item was additional property/fuzz/state-machine coverage. This continuation deliberately uses deterministic seeded reference models rather than non-reproducible smoke randomness.\n\nFocused signed commits:\n\n- `ab73209a94abcff4553cb1fccbec998672bd691c` — 5,000-operation `AttemptRateLimiter` reference-model state machine;\n- `d355d6c526593d1b78439d3168606707d0186247` — 4,000-operation `OneTimeAuthorizationStore` reference-model state machine;\n- `898f17a3157ab7af14d7aeb958b315dde1e1c2af` — 3,000-operation `DiscoveryRegistry` reference-model state machine.\n\nTogether the suites execute **12,000 deterministic generated operations**. They compare the production object's externally visible result against an intentionally simple model across expiry, bounded capacity, duplicate/replay rejection, reset/prune/clear transitions, one-time consumption, invalid discovery inputs, trusted-first/name ordering, and snapshot self-exclusion. Fixed seeds keep every failure reproducible.\n\nNo application/runtime source file changes in this tranche; it is regression-only hardening.\n\n## 199. Portable evidence and current-contract synchronization\n\nRelease-readiness `core-and-tests` on test head `898f17a3157ab7af14d7aeb958b315dde1e1c2af` completed successfully. The portable evidence included:\n\n- **26/26 Python helper tests**;\n- documentation integrity: 47 required files and 85 checked local Markdown links;\n- English/Hindi localization validation;\n- Apple integration metadata validation;\n- Windows protocol/private-network/app-notification integration validation;\n- Core Release build with zero warnings/errors;\n- **572/572 xUnit tests** with the three new state-machine suites passing;\n- benchmark Release build with zero warnings/errors;\n- machine-readable Core/test/benchmark vulnerable-package validation with zero findings.\n\nNormal CI run `32126274113`, CodeQL run `32126274127`, and security-hygiene run `32126274092` all completed successfully on the same test head. Release-readiness run `32126274097` also completed its Core/tests, Android compile/audit, and focused Windows compile/audit jobs successfully while the Apple job was still executing when this documentation sync began; no unfinished Apple result is inferred here.\n\nCurrent-state README/build/CI/roadmap/status documentation is synchronized from the prior 569-test contract to **572 xUnit tests** while preserving older historical evidence sections as history.\n\n## 200. Release-process documentation defect closure and remaining boundary\n\nDuring synchronization, the canonical release process was found to contain the aggregate-performance-evidence section twice and to retain a notification-era instruction requiring only 16 Python helper tests / 522 xUnit tests. The duplicated section was reduced to one canonical copy and the current candidate instruction was aligned to **26 Python helper tests / 572 xUnit tests**.\n\nThe August 18 state-machine tranche advances the optional property/fuzz/state-machine roadmap item but does not claim that adversarial testing is ever permanently exhausted. Further focused property testing remains appropriate when new defects, stateful components, protocol changes, or platform changes justify it.\n\nThe production-readiness boundary is unchanged: signed Android/Windows/Apple packaging, Apple provisioning/App Group/notarization, real device/provider/network/filesystem/lifecycle/low-storage testing, accessibility/localization on actual assistive technologies, exact signed-artifact dependency/license/provenance reconciliation, and final store/privacy publication checks remain external or exact-candidate evidence. Hosted source tests do not substitute for those gates.\n"""
              text += appendix
          write(path, text)
          PY
      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add README.md BUILDING.md NEXT_STEPS.md PROJECT_STATUS.md CHANGELOG.md docs/testing/ci-reference.md docs/release/release-process.md what_changed.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -s -m "docs(status): record state-machine hardening continuation"
          git push origin HEAD:continuation/state-machine-hardening-20260818
