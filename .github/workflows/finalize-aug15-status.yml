name: Finalize August 15 status

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-finalize-trigger

permissions:
  contents: write

jobs:
  finalize-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Finalize current-state documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          exact_source = "67fc3feaa506b16d11307afa9da8ca9d151f6d22"
          platform_run = "31867418650"
          current_ci_run = "31867674137"
          current_codeql_run = "31867674094"
          current_security_run = "31867674078"

          # NEXT_STEPS.md: preserve all historical evidence and insert the newest current snapshot once.
          path = Path("NEXT_STEPS.md")
          text = path.read_text(encoding="utf-8")
          marker = "## August 15 final automated evidence"
          if marker not in text:
              anchor = "Updated: 2026-08-15\n"
              section = f'''\n## August 15 final automated evidence\n\n- Exact runtime/source-changing head: `{exact_source}` (`fix(queue): preserve persistence across caller cancellation`).\n- Normal CI verified the expanded portable contract at **522/522 xUnit tests**, with 10 Python validation-helper tests, documentation integrity, localization, Apple metadata validation, Core/benchmark Release builds, and zero reported Core vulnerable-package findings.\n- Current documentation/source-state CI run `{current_ci_run}` completed successfully on both Ubuntu and the Windows PowerShell portable verifier.\n- Current documentation/source-state CodeQL run `{current_codeql_run}` and security-hygiene run `{current_security_run}` completed successfully.\n- Exact-source platform run `{platform_run}` completed successfully for Android, focused Windows, Mac Catalyst, iOS Simulator Share Extension, and iOS Simulator containing app, including target vulnerability audits and dependency-evidence uploads.\n- Queue cancellation hardening ensures caller cancellation during initialization or best-effort metadata persistence is not misclassified as permanent SQLite/storage unavailability.\n- No open GitHub issues remained at the final issue-queue check.\n- This hosted evidence does not replace signed Android/Windows/Apple packaging, real Apple App Group provisioning, physical cross-device/provider/network/storage/accessibility/localization validation, final signed-artifact dependency/license/provenance review, or store/privacy submission checks.\n'''
              text = text.replace(anchor, anchor + section, 1)
              path.write_text(text, encoding="utf-8")

          # PROJECT_STATUS.md: insert a final current snapshot without erasing prior dated evidence.
          path = Path("PROJECT_STATUS.md")
          text = path.read_text(encoding="utf-8")
          marker = "## August 15 final queue-v4 verification snapshot"
          if marker not in text:
              anchor = "Updated: 2026-08-15\n"
              section = f'''\n## August 15 final queue-v4 verification snapshot\n\n- Exact runtime/source-changing head is `{exact_source}`. The final source fix prevents caller cancellation from permanently disabling restart-safe queue persistence and sanitizes persisted exception-type error codes to the bounded machine-code contract.\n- SQLite schema remains **v4** with privacy-minimal operation/update/progress/item queue metadata. Stale active rows become `Interrupted` after restart, retain only safe context, and are never automatically replayed.\n- The portable xUnit contract is now **522/522 passing tests**. The current documentation/source-state CI run `{current_ci_run}` passed both Ubuntu and the Windows PowerShell verifier.\n- CodeQL run `{current_codeql_run}` and security-hygiene run `{current_security_run}` completed successfully on the current documentation/source state.\n- Exact-source platform run `{platform_run}` completed successfully across Android, focused Windows, Mac Catalyst, iOS Simulator Share Extension, and iOS Simulator containing app, including the maintained target dependency/vulnerability audits and evidence uploads.\n- README, architecture, storage, privacy, compatibility, manual/security testing, release checklist/process, roadmap/status, changelog, and engineering-ledger references are aligned to schema v4 and the 522-test current contract.\n- The final open-issue check returned no open GitHub issues.\n- Production readiness still requires the documented signed package, Apple provisioning/App Group, physical device/provider/network/filesystem/storage, accessibility/localization, exact signed-artifact dependency/license/provenance, notarization, and store/privacy gates.\n'''
              text = text.replace(anchor, anchor + section, 1)
              path.write_text(text, encoding="utf-8")

          # CHANGELOG.md: add the final cancellation/evidence closure bullets under August 15.
          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          bullet = "- Hardened queue persistence cancellation handling"
          if bullet not in text:
              anchor = "### Restart-safe queue progress and schema-v4 persistence\n"
              addition = f'''\n- Hardened queue persistence cancellation handling so caller cancellation during initialization or best-effort metadata writes does not mark SQLite persistence permanently unavailable for the app session.\n- Sanitized persisted exception-type error codes to the bounded machine-oriented error-code contract.\n- Expanded the current portable contract to **522/522 xUnit tests** and revalidated exact runtime source `{exact_source}` through successful Android, focused Windows, Mac Catalyst, iOS Share Extension, and iOS containing-app platform compilation/audit run `{platform_run}`.\n'''
              text = text.replace(anchor, anchor + addition, 1)
              path.write_text(text, encoding="utf-8")

          # what_changed.md: preserve every historical section and append the final continuation record.
          path = Path("what_changed.md")
          text = path.read_text(encoding="utf-8")
          marker = "# 159. Caller-cancellation queue persistence hardening"
          if marker not in text:
              text = text.replace("Date: 2026-08-14", "Date: 2026-08-15", 1)
              branding = "**Made by the Sanskar**"
              stripped = text.rstrip()
              if stripped.endswith(branding):
                  stripped = stripped[:-len(branding)].rstrip()

              appendix = f'''\n\n---\n\n# 159. Caller-cancellation queue persistence hardening\n\nFocused source commit `{exact_source}` closes a lifecycle edge discovered during final review of the richer queue persistence implementation.\n\nBefore this fix, a caller-cancelled persistence wait/write could flow through the generic best-effort storage catch path and set `_persistenceAvailable=false`, incorrectly treating ordinary transfer/request cancellation as evidence that SQLite was unusable for the remainder of the application session.\n\nThe corrected behavior is:\n\n- queue initialization rethrows caller cancellation instead of marking persistence unavailable or completing initialization with a false degraded state;\n- caller-cancelled best-effort queue metadata writes are ignored as cancelled writes but do **not** disable later persistence;\n- `ClearFinishedAsync` preserves caller cancellation semantics instead of turning it into a storage-health failure;\n- real SQLite/storage failures continue to disable only the best-effort persistence path and never change the transfer result;\n- exception type names are normalized through a bounded error-code sanitizer before persistence, retaining only ASCII letters/digits/`-`/`_`/`.` up to 64 characters with `transfer-error` fallback.\n\n# 160. Current-state schema-v4 documentation sweep\n\nA final repository-wide current-state sweep found several documents that still described schema v3 as current even though the queue enhancement had advanced the database to v4. Historical dated ledger/changelog references were preserved as history; current public/release instructions were corrected.\n\nFocused commits:\n\n- `3e7dd988bd50613b5781863219811394730dc8f4` — public README aligned with schema v4, restart-safe queue progress, and the 522-test current contract;\n- `9f2e76f13188e6139173cc7b85be87ac5100ad40` — architecture/local metadata description aligned with schema v4 and cancellation semantics;\n- `cdcc0fd7dc783264bb1baa102011be67a31108f8` — manual test matrix expanded for v0/v1/v2/v3→v4 migration, queue progress/restart/privacy/cancellation behavior;\n- `701ca698aa1a22beb3cb64bd6a4f5dc3277efe9e` — security test plan aligned to the schema-v4 non-authorizing queue boundary;\n- `234371b7d7d35844a07b400f32ff6e5b9c60168a` — release checklist requires schema-v4 migration/privacy/restart/cancellation checks;\n- the release-process update made the exact same v4 queue requirements part of candidate freeze, physical validation, accessibility, and privacy review.\n\nThe documentation intentionally continues to say that `completed_batch_items` was **introduced in schema v3** while correctly stating that the **current schema is v4**.\n\n# 161. Final automated evidence for the August 15 source continuation\n\nThe exact runtime/source-changing head is `{exact_source}`.\n\nPortable/source evidence:\n\n- Ubuntu normal CI on that source completed the full **522/522 xUnit** suite with zero failures/skips;\n- 10 Python validation-helper tests passed;\n- documentation integrity, English/Hindi localization validation, and Apple integration metadata validation passed;\n- Core and benchmark Release builds completed with zero reported build errors;\n- the machine-readable Core vulnerable-package report contained zero findings;\n- security-hygiene on the exact source succeeded.\n\nCurrent documentation/source-state evidence:\n\n- CI run `{current_ci_run}` completed successfully on both Ubuntu and the Windows PowerShell portable verifier using the same runtime source;\n- CodeQL run `{current_codeql_run}` completed successfully;\n- security-hygiene run `{current_security_run}` completed successfully.\n\nExact-source platform evidence:\n\n- platform run `{platform_run}` completed successfully;\n- Android Release compile/audit succeeded;\n- focused Windows Release compile/audit succeeded;\n- Mac Catalyst containing-app Release compile/audit succeeded;\n- iOS Simulator Share Extension Release compile succeeded;\n- iOS Simulator containing-app Release compile succeeded;\n- iOS containing-app and Share Extension vulnerable-package audits succeeded;\n- Android, Windows, and Apple dependency-evidence artifacts uploaded successfully.\n\nThe final open-issue search returned no open GitHub issues.\n\n# 162. Final source/release boundary for this continuation\n\nSwiftDrop is source-complete for the current master-prompt scope plus the implemented restart-safe queue enhancement. The current hosted source contract includes schema-v4 queue migration/persistence, sender progress integration, queue UI progress/context, caller-cancellation resilience, 522 portable xUnit tests, two-OS portable CI, CodeQL/security hygiene, and the maintained Android/Windows/Mac Catalyst/iOS hosted platform matrix.\n\nThis does **not** convert hosted/source evidence into a production-ready claim. The remaining release work is deliberately external or exact-candidate distribution evidence:\n\n- signed Android AAB/APK and install/upgrade/policy validation;\n- signed Windows MSIX/package install/update/protocol/capability/firewall validation;\n- Apple Developer App Group/provisioning for the iOS app and Share Extension;\n- signed iOS/TestFlight Share Extension/provider/App Group behavior;\n- signed/notarized Mac Catalyst sandbox/network/native-drop validation;\n- physical cross-device transfer/resume/network/filesystem/low-storage/provider testing;\n- real SecureStorage/keychain/keystore and supported schema-upgrade scenarios;\n- TalkBack/VoiceOver/Narrator/keyboard/large-text/high-contrast/Hindi validation;\n- exact final signed-artifact dependency/license/provenance reconciliation;\n- store/privacy metadata and submission checks.\n'''
              path.write_text(stripped + appendix + "\n\n" + branding + "\n", encoding="utf-8")
          PY

      - name: Commit final status evidence
        shell: bash
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add NEXT_STEPS.md PROJECT_STATUS.md CHANGELOG.md what_changed.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -s -m "docs(status): finalize August 15 queue evidence"
          git push origin HEAD:main
