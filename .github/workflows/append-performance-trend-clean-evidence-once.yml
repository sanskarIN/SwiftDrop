name: Append performance trend clean evidence once

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-performance-trend-clean-evidence-trigger

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Append cleaned-main evidence
        run: python3 .github/swiftdrop-append-performance-trend-clean-evidence.py
