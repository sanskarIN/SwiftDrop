name: Release readiness

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release-readiness.yml'
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'SwiftDrop.slnx'
      - 'Directory.Build.props'
      - 'global.json'
      - 'NuGet.config'
      - 'scripts/verify-core.sh'
      - 'scripts/verify-core.ps1'
      - 'scripts/validate_nuget_vulnerability_report.py'
      - 'scripts/create_dependency_evidence_manifest.py'
      - 'scripts/validate_windows_integration.py'
      - 'scripts/tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/release-readiness.yml'
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'SwiftDrop.slnx'
      - 'Directory.Build.props'
      - 'global.json'
      - 'NuGet.config'
      - 'scripts/verify-core.sh'
      - 'scripts/verify-core.ps1'
      - 'scripts/validate_nuget_vulnerability_report.py'
      - 'scripts/create_dependency_evidence_manifest.py'
      - 'scripts/validate_windows_integration.py'
      - 'scripts/tests/**'

permissions:
  contents: read

jobs:
  core-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify portable source and documentation
        run: ./scripts/verify-core.sh
      - name: Compile synthetic benchmark harness
        run: dotnet build benchmarks/SwiftDrop.Benchmarks/SwiftDrop.Benchmarks.csproj -c Release
      - name: Capture and validate portable dependency reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet package list --project src/SwiftDrop.Core/SwiftDrop.Core.csproj --include-transitive --no-restore --format json --output-version 1 > artifacts/core-packages.json
          dotnet package list --project tests/SwiftDrop.Core.Tests/SwiftDrop.Core.Tests.csproj --include-transitive --no-restore --format json --output-version 1 > artifacts/test-packages.json
          dotnet package list --project benchmarks/SwiftDrop.Benchmarks/SwiftDrop.Benchmarks.csproj --include-transitive --no-restore --format json --output-version 1 > artifacts/benchmark-packages.json
          dotnet package list --project src/SwiftDrop.Core/SwiftDrop.Core.csproj --include-transitive --vulnerable --no-restore --format json --output-version 1 > artifacts/core-vulnerabilities.json
          dotnet package list --project tests/SwiftDrop.Core.Tests/SwiftDrop.Core.Tests.csproj --include-transitive --vulnerable --no-restore --format json --output-version 1 > artifacts/test-vulnerabilities.json
          dotnet package list --project benchmarks/SwiftDrop.Benchmarks/SwiftDrop.Benchmarks.csproj --include-transitive --vulnerable --no-restore --format json --output-version 1 > artifacts/benchmark-vulnerabilities.json
          python3 scripts/validate_nuget_vulnerability_report.py artifacts/core-vulnerabilities.json artifacts/test-vulnerabilities.json artifacts/benchmark-vulnerabilities.json
          python3 scripts/create_dependency_evidence_manifest.py artifacts artifacts/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: artifacts/

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: dotnet workload install maui-android
      - name: Restore Android app
        run: dotnet restore src/SwiftDrop.App/SwiftDrop.App.csproj -p:TargetFramework=net10.0-android
      - name: Restore shared core target
        run: dotnet restore src/SwiftDrop.Core/SwiftDrop.Core.csproj
      - name: Build Android app
        run: dotnet build src/SwiftDrop.App/SwiftDrop.App.csproj -f net10.0-android -c Release --no-restore
      - name: Capture and validate Android dependency audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          export SwiftDropTargetFrameworksOverride=net10.0-android
          dotnet package list --project src/SwiftDrop.App/SwiftDrop.App.csproj --framework net10.0-android --include-transitive --no-restore --format json --output-version 1 > artifacts/android/packages.json
          dotnet package list --project src/SwiftDrop.App/SwiftDrop.App.csproj --framework net10.0-android --include-transitive --vulnerable --no-restore --format json --output-version 1 > artifacts/android/vulnerabilities.json
          python3 scripts/validate_nuget_vulnerability_report.py artifacts/android/vulnerabilities.json
          python3 scripts/create_dependency_evidence_manifest.py artifacts/android artifacts/android/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-dependency-audit
          path: artifacts/android/

  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: dotnet workload install maui-windows
      - name: Restore Windows app runtime
        shell: pwsh
        run: |
          $env:SwiftDropTargetFrameworksOverride='net10.0-windows10.0.19041.0'
          dotnet restore src/SwiftDrop.App/SwiftDrop.App.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifierOverride=win-x64 -p:SkipIosShareExtensionProjectReference=true
      - name: Restore shared core runtime
        run: dotnet restore src/SwiftDrop.Core/SwiftDrop.Core.csproj -r win-x64
      - name: Build Windows app without MSIX packaging
        shell: pwsh
        run: |
          $env:SwiftDropTargetFrameworksOverride='net10.0-windows10.0.19041.0'
          dotnet build src/SwiftDrop.App/SwiftDrop.App.csproj -f net10.0-windows10.0.19041.0 -c Release --no-restore -p:RuntimeIdentifierOverride=win-x64 -p:SkipIosShareExtensionProjectReference=true -p:WindowsPackageType=None -p:GenerateAppxPackageOnBuild=false
      - name: Capture and validate Windows dependency audit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          $env:SwiftDropTargetFrameworksOverride='net10.0-windows10.0.19041.0'
          dotnet package list --project src/SwiftDrop.App/SwiftDrop.App.csproj --framework net10.0-windows10.0.19041.0 --include-transitive --no-restore --format json --output-version 1 | Out-File -Encoding utf8 artifacts/windows/packages.json
          dotnet package list --project src/SwiftDrop.App/SwiftDrop.App.csproj --framework net10.0-windows10.0.19041.0 --include-transitive --vulnerable --no-restore --format json --output-version 1 | Out-File -Encoding utf8 artifacts/windows/vulnerabilities.json
          python scripts/validate_nuget_vulnerability_report.py artifacts/windows/vulnerabilities.json
          python scripts/create_dependency_evidence_manifest.py artifacts/windows artifacts/windows/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dependency-audit
          path: artifacts/windows/

  apple-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: dotnet workload install maui-ios maui-maccatalyst
      - name: Select Apple simulator runtimes
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            echo "MACCATALYST_RID=maccatalyst-arm64" >> "$GITHUB_ENV"
            echo "IOS_SIMULATOR_RID=iossimulator-arm64" >> "$GITHUB_ENV"
          else
            echo "MACCATALYST_RID=maccatalyst-x64" >> "$GITHUB_ENV"
            echo "IOS_SIMULATOR_RID=iossimulator-x64" >> "$GITHUB_ENV"
          fi
      - name: Restore Mac Catalyst app and shared Core runtime
        shell: bash
        run: |
          dotnet restore src/SwiftDrop.App/SwiftDrop.App.csproj -p:TargetFramework=net10.0-maccatalyst -p:RuntimeIdentifier="$MACCATALYST_RID"
          dotnet restore src/SwiftDrop.Core/SwiftDrop.Core.csproj -p:RuntimeIdentifier="$MACCATALYST_RID"
      - name: Build Mac Catalyst app
        shell: bash
        run: dotnet build src/SwiftDrop.App/SwiftDrop.App.csproj -f net10.0-maccatalyst -c Release --no-restore -p:RuntimeIdentifier="$MACCATALYST_RID"
      - name: Capture and validate Mac Catalyst dependency audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apple/maccatalyst
          export SwiftDropTargetFrameworksOverride=net10.0-maccatalyst
          dotnet package list --project src/SwiftDrop.App/SwiftDrop.App.csproj --framework net10.0-maccatalyst --include-transitive --no-restore --format json --output-version 1 > artifacts/apple/maccatalyst/packages.json
          dotnet package list --project src/SwiftDrop.App/SwiftDrop.App.csproj --framework net10.0-maccatalyst --include-transitive --vulnerable --no-restore --format json --output-version 1 > artifacts/apple/maccatalyst/vulnerabilities.json
          python3 scripts/validate_nuget_vulnerability_report.py artifacts/apple/maccatalyst/vulnerabilities.json
          unset SwiftDropTargetFrameworksOverride
      - name: Restore iOS simulator app, extension, and shared Core runtime
        shell: bash
        run: |
          dotnet restore src/SwiftDrop.ShareExtension/SwiftDrop.ShareExtension.csproj -p:RuntimeIdentifier="$IOS_SIMULATOR_RID" -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:CodesignEntitlements=
          dotnet restore src/SwiftDrop.App/SwiftDrop.App.csproj -p:TargetFramework=net10.0-ios -p:RuntimeIdentifier="$IOS_SIMULATOR_RID" -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:CodesignEntitlements=
          dotnet restore src/SwiftDrop.Core/SwiftDrop.Core.csproj -p:RuntimeIdentifier="$IOS_SIMULATOR_RID"
      - name: Build iOS simulator share extension
        shell: bash
        run: dotnet build src/SwiftDrop.ShareExtension/SwiftDrop.ShareExtension.csproj -f net10.0-ios -c Release --no-restore -p:RuntimeIdentifier="$IOS_SIMULATOR_RID" -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:CodesignEntitlements=
      - name: Build iOS simulator app
        shell: bash
        run: dotnet build src/SwiftDrop.App/SwiftDrop.App.csproj -f net10.0-ios -c Release --no-restore -p:RuntimeIdentifier="$IOS_SIMULATOR_RID" -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:CodesignEntitlements=
      - name: Capture and validate iOS dependency audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apple/ios-app artifacts/apple/ios-share-extension
          export SwiftDropTargetFrameworksOverride=net10.0-ios
          dotnet package list --project src/SwiftDrop.App/SwiftDrop.App.csproj --framework net10.0-ios --include-transitive --no-restore --format json --output-version 1 > artifacts/apple/ios-app/packages.json
          dotnet package list --project src/SwiftDrop.App/SwiftDrop.App.csproj --framework net10.0-ios --include-transitive --vulnerable --no-restore --format json --output-version 1 > artifacts/apple/ios-app/vulnerabilities.json
          unset SwiftDropTargetFrameworksOverride
          dotnet package list --project src/SwiftDrop.ShareExtension/SwiftDrop.ShareExtension.csproj --framework net10.0-ios --include-transitive --no-restore --format json --output-version 1 > artifacts/apple/ios-share-extension/packages.json
          dotnet package list --project src/SwiftDrop.ShareExtension/SwiftDrop.ShareExtension.csproj --framework net10.0-ios --include-transitive --vulnerable --no-restore --format json --output-version 1 > artifacts/apple/ios-share-extension/vulnerabilities.json
          python3 scripts/validate_nuget_vulnerability_report.py artifacts/apple/ios-app/vulnerabilities.json artifacts/apple/ios-share-extension/vulnerabilities.json
          python3 scripts/create_dependency_evidence_manifest.py artifacts/apple artifacts/apple/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: apple-dependency-audit
          path: artifacts/apple/

  release-gate:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - core-and-tests
      - android-compile
      - windows-compile
      - apple-compile
    steps:
      - name: Require successful compile and test gates
        env:
          CORE_RESULT: ${{ needs.core-and-tests.result }}
          ANDROID_RESULT: ${{ needs.android-compile.result }}
          WINDOWS_RESULT: ${{ needs.windows-compile.result }}
          APPLE_RESULT: ${{ needs.apple-compile.result }}
        run: |
          test "$CORE_RESULT" = "success"
          test "$ANDROID_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
          test "$APPLE_RESULT" = "success"
          echo "Source, protocol tests, portable benchmark compilation, dependency audits, and all maintained platform compile gates passed."
          echo "Signed Windows MSIX, physical-device testing, Apple signing/notarization/App Group provisioning, Share Extension behavior, native notification behavior, and store checks are still required."
