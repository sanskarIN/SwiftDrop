name: Final documentation sync once

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-final-doc-sync-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Synchronize final documentation
        run: python3 .github/swiftdrop-final-doc-sync.py
      - name: Push focused documentation commits
        run: git push origin HEAD:main
