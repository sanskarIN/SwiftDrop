name: Performance release docs once

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-performance-release-docs-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Update architecture
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/architecture.md')
          s=p.read_text()
          def one(a,b):
              global s
              c=s.count(a)
              if c!=1: raise SystemExit(f'architecture expected one match, found {c}: {a[:100]!r}')
              s=s.replace(a,b)
          one('`BatchResumeStateService` — best-effort app bridge to completed-batch metadata introduced in schema v3 and retained in current schema v4, plus Core file revalidation.', '`BatchResumeStateService` — best-effort app bridge to completed-batch metadata introduced in schema v3 and retained in current schema v6, plus Core file revalidation.')
          one('`TransferHistoryService` — retention/privacy-aware history.', '`TransferHistoryService` — retention/privacy-aware history plus optional schema-v6 completed-transfer duration/actual-byte performance measurements normalized through portable Core policy.')
          one('The `completed_batch_items` table was introduced in SQLite schema v3 and remains part of current schema v4.', 'The `completed_batch_items` table was introduced in SQLite schema v3 and remains part of current schema v6.')
          one('Current SQLite schema version: **4**.', 'Current SQLite schema version: **6**.')
          one('- transfer history;\n', '- transfer history with optional bounded duration and attributable measured-byte metadata for valid completed-transfer performance samples;\n')
          marker='## Restart-safe queue metadata\n'
          section='''## Local History performance measurements\n\nSQLite schema v5 adds nullable bounded `duration_ms`; schema v6 adds nullable non-negative `measured_bytes`. Older rows remain null rather than receiving inferred measurements.\n\nThe application measures elapsed transfer intervals with monotonic `Stopwatch` timing. Single-file sender history uses the sender-negotiated remaining byte count; receiver single-file and accepted batch-item history uses `length - resume offset`; completed text sends use UTF-8 byte length. Failed, paused, cancelled, rejected, skipped, legacy, zero-byte, or otherwise unattributable events do not become throughput samples.\n\n`TransferPerformanceAnalyzer` is a portable Core policy boundary. It rejects impossible samples (`measured_bytes > size_bytes`, invalid duration, non-completed status), saturates extreme aggregate counters, and computes weighted throughput from total measured bytes divided by total measured duration. Invalid optional measurement input is dropped rather than being allowed to change a successful transfer result.\n\nThe History UI presents only valid per-row duration/rate values and a localized weighted summary. Performance metadata remains inside the same History retention/privacy boundary and does not persist peer endpoints, transfer contents, pairing capabilities/nonces, credentials, certificates/private keys, or reusable authorization.\n\n'''
          if marker not in s: raise SystemExit('architecture performance insertion marker missing')
          s=s.replace(marker, section+marker,1)
          p.write_text(s)
      - name: Commit architecture
        run: |
          git add docs/architecture.md
          git commit -m "docs(architecture): describe schema v6 performance history" -m "Signed-off-by: Sanskar <sanskarin@outlook.in>"
      - name: Update manual matrix
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/testing/manual-test-matrix.md')
          s=p.read_text()
          def one(a,b):
              global s
              c=s.count(a)
              if c!=1: raise SystemExit(f'manual matrix expected one match, found {c}: {a[:100]!r}')
              s=s.replace(a,b)
          one('''- Fresh database → schema v4.\n- Real copied v1 database → v4.\n- Real copied v2 database → v4.\n- Real copied v3 database with legacy queue rows → v4 without losing safe existing metadata.\n''', '''- Fresh database → schema v6.\n- Real copied v1 database → v6.\n- Real copied v2 database → v6.\n- Real copied v3 database with legacy queue rows → v6 without losing safe existing metadata.\n- Real copied v4 history rows → v6 with `duration_ms` and `measured_bytes` remaining null rather than synthesized.\n- Real copied v5 history rows → v6 preserving any stored duration while leaving `measured_bytes` null.\n''')
          anchor='- Clearing app data/history behaves as documented.\n'
          perf='''- Complete a normal non-zero file transfer and confirm History shows a duration and rate based on the bytes actually transferred.\n- Resume a partially transferred file and confirm the History logical size remains the full file size while the measured throughput uses only bytes remaining after the negotiated resume offset.\n- Complete a zero-byte transfer and confirm it does not create a throughput sample.\n- Confirm failed, cancelled, paused, rejected, not-selected, legacy, and otherwise unmeasured rows do not display a fabricated throughput value or contribute to the weighted summary.\n- Confirm the aggregate History rate equals total measured bytes divided by total measured duration rather than an unweighted average of row rates.\n- Enable privacy mode and confirm peer/file labels remain hidden while numeric performance metadata follows the same local History retention policy.\n- Set zero-day history retention / clear History and confirm performance samples disappear with their owning history rows.\n'''
          if anchor not in s: raise SystemExit('manual matrix perf anchor missing')
          s=s.replace(anchor, anchor+perf,1)
          one('- Confirm queue operation category, percentage/item counts, progress bar, interrupted state, timing, and error context remain readable at large text sizes and in Hindi.', '- Confirm queue operation category, percentage/item counts, progress bar, interrupted state, timing, and error context remain readable at large text sizes and in Hindi.\n- Confirm History performance summary, per-row duration, and per-row throughput remain readable with large text, narrow windows, screen readers, and Hindi localization.')
          p.write_text(s)
      - name: Commit manual matrix
        run: |
          git add docs/testing/manual-test-matrix.md
          git commit -m "docs(testing): add performance-history physical matrix" -m "Signed-off-by: Sanskar <sanskarin@outlook.in>"
      - name: Update security plan
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/testing/security-test-plan.md')
          s=p.read_text()
          def one(a,b):
              global s
              c=s.count(a)
              if c!=1: raise SystemExit(f'security plan expected one match, found {c}: {a[:100]!r}')
              s=s.replace(a,b)
          one('Verify `completed_batch_items`, introduced in schema v3 and retained in schema v4, never contains the absolute receive root, pairing nonce/code, certificate private key, or transferred content.', 'Verify `completed_batch_items`, introduced in schema v3 and retained in current schema v6, never contains the absolute receive root, pairing nonce/code, certificate private key, or transferred content.')
          one('- Inspect a fresh/upgrade SQLite database and confirm current schema version is 4.\n- Verify v0/v1/v2/v3 databases migrate to v4 according to the supported migration contract; preserve safe legacy v3 queue rows with defaults.\n', '- Inspect a fresh/upgrade SQLite database and confirm current schema version is 6.\n- Verify v0/v1/v2/v3/v4/v5 databases migrate to v6 according to the supported migration contract; preserve safe legacy v3 queue rows with defaults, leave v4 performance fields null, and preserve v5 duration without inventing measured bytes.\n')
          anchor='- Inspect SQLite after representative operations and confirm it contains metadata only.\n'
          perf='''- Verify valid completed performance rows contain only bounded duration plus actual attributable measured bytes and never peer endpoints, transfer contents, pairing capabilities/nonces, credentials, certificates/private keys, or reusable authorization.\n- Resume a file and verify `measured_bytes` equals bytes actually transferred after the negotiated resume offset and never exceeds logical `size_bytes`.\n- Seed malformed/impossible performance metadata and verify it is rejected/skipped rather than influencing throughput or weakening transfer authorization/integrity behavior.\n- Verify optional performance-normalization failure is best-effort and cannot convert a successful transfer into a failed transfer result.\n'''
          if anchor not in s: raise SystemExit('security perf anchor missing')
          s=s.replace(anchor, anchor+perf,1)
          p.write_text(s)
      - name: Commit security plan
        run: |
          git add docs/testing/security-test-plan.md
          git commit -m "docs(security): add schema v6 performance metadata checks" -m "Signed-off-by: Sanskar <sanskarin@outlook.in>"
      - name: Update release checklist
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/release/release-checklist.md')
          s=p.read_text()
          def rep(a,b,minimum=1):
              global s
              c=s.count(a)
              if c<minimum: raise SystemExit(f'release checklist expected match, found {c}: {a[:100]!r}')
              s=s.replace(a,b)
          rep('- [ ] Current SQLite schema is v4 and documentation/tests/migrations agree on the v0/v1/v2/v3→v4 upgrade contract.', '- [ ] Current SQLite schema is v6 and documentation/tests/migrations agree on the v0/v1/v2/v3/v4/v5→v6 upgrade contract, including null-preserving legacy performance fields.')
          rep('`completed_batch_items`, introduced in schema v3 and retained in current schema v4', '`completed_batch_items`, introduced in schema v3 and retained in current schema v6')
          rep('`completed_batch_items`, introduced in schema v3 and retained in v4', '`completed_batch_items`, introduced in schema v3 and retained in current schema v6')
          rep('Schema-v4 queue persistence stores only generic persisted labels, bounded state/error/operation/timestamp/progress/item metadata and never replays authorization after restart.', 'The queue persistence contract introduced through schema v4 and retained in schema v6 stores only generic persisted labels, bounded state/error/operation/timestamp/progress/item metadata and never replays authorization after restart.')
          rep('- [ ] Privacy mode redacts peer/file history labels and privacy-sensitive diagnostic identifiers.', '- [ ] Privacy mode redacts peer/file history labels and privacy-sensitive diagnostic identifiers.\n- [ ] Schema-v6 History performance fields are optional/bounded; measured bytes never exceed logical size, resumed transfers count only post-offset bytes, legacy/unmeasured rows are not assigned rates, and invalid optional measurements cannot change the underlying transfer outcome.\n- [ ] History retention/clear behavior removes performance metadata together with its owning history rows; numeric performance metadata adds no peer endpoint, content, credential, certificate, pairing capability, or reusable authorization.')
          rep('- [ ] Optional Android completion/failure notification text remains generic and content-free.', '- [ ] Optional Android/iOS/Mac Catalyst/Windows completion/failure notification text remains generic and content-free.')
          anchor='- [ ] queue restart/interrupted metadata behavior, recovered progress/item display, and no stale authorization replay.\n'
          perf='''- [ ] normal completed file/text History samples display measured duration/rate where attributable;\n- [ ] resumed-file History samples use only actual bytes transferred after the negotiated offset;\n- [ ] zero-byte/failed/cancelled/paused/rejected/legacy rows do not display fabricated throughput;\n- [ ] weighted History summary and English/Hindi presentation are validated on representative devices.\n'''
          if anchor not in s: raise SystemExit('release checklist physical anchor missing')
          s=s.replace(anchor, anchor+perf,1)
          p.write_text(s)
      - name: Commit release checklist
        run: |
          git add docs/release/release-checklist.md
          git commit -m "docs(release): gate schema v6 performance history" -m "Signed-off-by: Sanskar <sanskarin@outlook.in>"
      - name: Update release process
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/release/release-process.md')
          s=p.read_text()
          def one(a,b):
              global s
              c=s.count(a)
              if c!=1: raise SystemExit(f'release process expected one match, found {c}: {a[:100]!r}')
              s=s.replace(a,b)
          one('For the current source that means schema **v4**, including safe v3 queue-row migration defaults and the non-authorizing restart-safe queue contract.', 'For the current source that means schema **v6**, including safe v3 queue-row migration defaults, null-preserving v4/v5 History performance migrations, the non-authorizing restart-safe queue contract, and bounded optional duration/measured-byte metadata.')
          one('- schema-v4 queue restart/progress/item recovery;\n', '- schema-v6 database upgrade plus queue restart/progress/item recovery;\n- History performance sampling for full/resumed transfers, including actual post-resume measured-byte attribution and exclusion of zero-byte/failed/legacy/unmeasured rows;\n')
          one('For schema-v4 queue persistence, confirm the shipped application stores only the documented generic label/state/error/operation/timestamp/progress/item metadata and does not introduce pairing nonces, reusable authorization/session tokens, certificates/private keys, peer endpoints, source/destination paths, or transferred contents into the queue table.', 'For current schema v6, confirm the queue contract introduced through v4 still stores only the documented generic label/state/error/operation/timestamp/progress/item metadata and does not introduce pairing nonces, reusable authorization/session tokens, certificates/private keys, peer endpoints, source/destination paths, or transferred contents into the queue table. Confirm History performance metadata is limited to bounded duration/actual measured-byte fields under existing History retention/privacy rules and is never reusable transfer authorization.')
          p.write_text(s)
      - name: Commit release process
        run: |
          git add docs/release/release-process.md
          git commit -m "docs(release): align process with schema v6" -m "Signed-off-by: Sanskar <sanskarin@outlook.in>"
      - name: Push focused documentation commits
        run: git push origin HEAD:main
