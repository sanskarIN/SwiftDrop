name: Fix performance trend docs once

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-performance-trend-doc-fix-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Fix maintained trend documentation
        run: python3 .github/swiftdrop-fix-performance-trend-docs.py
