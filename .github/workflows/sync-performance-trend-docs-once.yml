name: Sync performance trend docs once

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-performance-trend-docs-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh main and configure Git
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Synchronize maintained documentation
        run: python3 .github/swiftdrop-sync-performance-trend-docs.py
