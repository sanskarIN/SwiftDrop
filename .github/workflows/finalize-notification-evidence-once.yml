name: Finalize native notification evidence once

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-notification-evidence-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Finalize notification evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          BRANDING = "**Made by the Sanskar**"
          runtime_head = "c3bd4d9fd5389a56fd203a5e4edb31033631181a"
          platform_run = "31870987664"
          portable_run = "31871039534"
          clean_ci_run = "31871539203"
          clean_codeql_run = "31871539201"
          clean_security_run = "31871539219"
          failed_release_run = "31871195203"
          release_fix = "594e586dcda99d75b4d79da0ce9362813e28d4f5"
          release_run = "31871378565"

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          # PROJECT_STATUS.md
          path = "PROJECT_STATUS.md"
          text = read(path)
          marker = "## August 15 final native-notification verification snapshot"
          if marker not in text:
              anchor = "Updated: 2026-08-15\n"
              section = f'''\n## August 15 final native-notification verification snapshot\n\n- Exact runtime notification source head: `{runtime_head}`.\n- Exact-source platform run `{platform_run}` passed Android, focused Windows, Mac Catalyst, iOS Simulator Share Extension, iOS Simulator containing app, target vulnerability audits, and dependency-evidence uploads.\n- Portable run `{portable_run}` passed both Ubuntu and Windows with **16 Python validation-helper tests**, the Windows package-notification validator, **522/522 xUnit tests**, benchmark compilation, documentation/localization/Apple metadata checks, and zero reported Core vulnerable-package findings.\n- Clean documentation/source-state CI `{clean_ci_run}`, CodeQL `{clean_codeql_run}`, and security-hygiene `{clean_security_run}` all passed after the notification documentation/helper cleanup.\n- Release-readiness self-test `{failed_release_run}` exposed a real workflow-only Apple restore defect: the Mac Catalyst app restore did not explicitly restore `SwiftDrop.Core` for the selected Mac Catalyst RID. Runtime notification source was not implicated.\n- Commit `{release_fix}` aligned release readiness with the maintained platform workflow by restoring shared Core for Mac Catalyst and iOS simulator RIDs. Corrected release-readiness run `{release_run}` passed Core/tests, Android, Windows, Mac Catalyst, iOS Share Extension, iOS containing app, dependency audits/uploads, and the final aggregate `release-gate`.\n- Corrected release evidence artifacts include `dependency-audit`, `android-dependency-audit`, `windows-dependency-audit`, and `apple-dependency-audit` with GitHub-recorded SHA-256 artifact digests.\n- Final issue/PR queue check found no open GitHub issues and no open pull requests.\n- Signed Android/iOS/Mac Catalyst/Windows notification permission, registration, presentation/activation, install/update, system-settings, accessibility/localization, and store-policy behavior remains a release-validation requirement rather than a hosted-source claim.\n'''
              if anchor not in text:
                  raise SystemExit("PROJECT_STATUS update anchor missing")
              write(path, text.replace(anchor, anchor + section, 1))

          # NEXT_STEPS.md
          path = "NEXT_STEPS.md"
          text = read(path)
          marker = "## August 15 final native-notification automated evidence"
          if marker not in text:
              anchor = "Updated: 2026-08-15\n"
              section = f'''\n## August 15 final native-notification automated evidence\n\n- Runtime source `{runtime_head}` is green in exact platform run `{platform_run}` across Android, Windows, Mac Catalyst, iOS Share Extension, and iOS containing app, with target vulnerability audits and evidence uploads.\n- Portable verification run `{portable_run}` is green on Ubuntu and Windows with 16 helper tests, the Windows packaged-notification validator, 522/522 xUnit tests, benchmark compilation, and zero reported Core vulnerabilities.\n- Current cleaned documentation/source state passed CI `{clean_ci_run}`, CodeQL `{clean_codeql_run}`, and security hygiene `{clean_security_run}`.\n- Release-readiness run `{failed_release_run}` correctly surfaced an Apple shared-Core RID restore gap; commit `{release_fix}` fixed the workflow rather than weakening the gate.\n- Corrected release-readiness run `{release_run}` passed every compile/test/audit job and the aggregate release gate.\n- No open GitHub issues or pull requests remained at the final queue check.\n- The remaining native-notification work is physical/signed validation: Android permission/delivery, iOS/Mac authorization and foreground/background/system presentation, Windows signed package toast/COM registration/activation and install/update, accessibility/localization, and store/privacy declarations.\n'''
              if anchor not in text:
                  raise SystemExit("NEXT_STEPS update anchor missing")
              write(path, text.replace(anchor, anchor + section, 1))

          # CHANGELOG.md
          path = "CHANGELOG.md"
          text = read(path)
          marker = "- Corrected release-readiness Apple runtime restore after the notification self-test exposed"
          if marker not in text:
              anchor = "### Cross-platform native terminal notifications\n"
              addition = f'''\n- Exact runtime source `{runtime_head}` passed hosted Android, focused Windows, Mac Catalyst, iOS Share Extension, and iOS containing-app compilation/audit run `{platform_run}`.\n- Portable verification is green on Ubuntu and Windows with 16 Python helper tests, the Windows notification/package validator, and 522/522 xUnit tests.\n- Corrected release-readiness Apple runtime restore after the notification self-test exposed a missing shared-Core RID restore; fixed run `{release_run}` passed every compile/test/audit job and the final aggregate release gate.\n'''
              if anchor not in text:
                  raise SystemExit("CHANGELOG notification section missing")
              write(path, text.replace(anchor, anchor + addition, 1))

          # what_changed.md - preserve every earlier numbered section.
          path = "what_changed.md"
          text = read(path)
          marker = "# 169. Final automated evidence for native notifications"
          if marker not in text:
              stripped = text.rstrip()
              if stripped.endswith(BRANDING):
                  stripped = stripped[:-len(BRANDING)].rstrip()
              appendix = f'''\n\n---\n\n# 169. Final automated evidence for native notifications\n\nExact runtime notification source head: `{runtime_head}`.\n\nRuntime/platform evidence:\n\n- Platform run `{platform_run}` completed successfully for Android, focused Windows, Mac Catalyst, iOS Simulator Share Extension, and iOS Simulator containing app.\n- Android, Windows, Mac Catalyst, iOS app, and iOS Share Extension vulnerable-package audits completed without reported findings under the maintained validator.\n- Android, Windows, and Apple dependency-evidence artifacts uploaded successfully.\n- The exact platform-run artifact digests were `sha256:7557198dedf07b37709ea8ad7fdd091826e4543a538e2a22c4b25becd7bc0623` (Android), `sha256:67420bb0f7195f32cc89a57d7f448161a334a819ee953d8ee85b3b584e486eb8` (Windows), and `sha256:95a0451c9f21fa541422907ee0d62dc0a4fac2e88204f2e2ab6591f1e52d2abb` (Apple).\n\nPortable/static evidence:\n\n- Run `{portable_run}` passed on both Ubuntu and Windows with **16 Python helper tests**, documentation integrity, localization validation, Apple integration validation, the Windows packaged-notification validator, Core/benchmark Release builds, **522/522 xUnit tests**, and a zero-finding Core vulnerable-package report.\n- Cleaned documentation/source-state CI `{clean_ci_run}` passed both portable jobs.\n- CodeQL `{clean_codeql_run}` and security hygiene `{clean_security_run}` passed on that cleaned state.\n\nRelease-readiness defect closure:\n\n- Initial release-readiness self-test `{failed_release_run}` failed only in its Apple workflow path because it restored the Mac Catalyst application but did not explicitly restore `SwiftDrop.Core` for the selected Mac Catalyst RID before a `--no-restore` build.\n- The maintained platform workflow already had the correct shared-Core restore sequence, and the exact notification source platform matrix was green.\n- Commit `{release_fix}` fixed release readiness by explicitly restoring shared Core for both the Mac Catalyst and iOS simulator RIDs; the gate was not disabled or weakened.\n- A commit-range check from runtime head `{runtime_head}` to release-fix head `{release_fix}` confirmed no SwiftDrop runtime application source changed; only workflow/documentation/Windows-validator test infrastructure changed.\n- Corrected release-readiness run `{release_run}` then passed `core-and-tests`, `android-compile`, `windows-compile`, `apple-compile`, dependency audits/uploads, and the final `release-gate`.\n- Its retained artifact digests include `sha256:d7d9741dde67f493299e3dcfb497d4de290382cf2223640398072584a6f1efec` (`dependency-audit`), `sha256:7f05cf460fd65776009bf82850ed868dd4245fd8d585977af534193e03323816` (Android), `sha256:576fdd16038942c16f0ec21e5e8f24f7f4c318434c4b12bd563a9bfd2688a474` (Windows), and `sha256:2535b77431b3a7cbee81111109f505ce3779a13f88a9993af62dc6671684b708` (Apple).\n\nRepository queue evidence:\n\n- Final open-issue search returned no open GitHub issues.\n- Final open-PR search returned no open GitHub pull requests.\n\n# 170. Final source/release boundary after native notifications\n\nSwiftDrop source now contains the planned optional generic terminal notification feature across every maintained product target:\n\n- Android local terminal notifications with explicit Android 13+ permission handling where required;\n- iOS/Mac Catalyst local User Notifications authorization and foreground presentation;\n- Windows App SDK app notifications with packaged toast/COM activation metadata, startup registration, handler-before-register ordering, and deterministic unregister;\n- generic placeholder-free English/Hindi notification messages and localized platform guidance;\n- a portable Windows package/source validator with dedicated regression coverage;\n- integration into Bash, PowerShell, normal CI, platform compile/audit, CodeQL/security-hygiene, and release-readiness verification.\n\nThe source/hosted verification for this enhancement is complete. It still does **not** establish production readiness for notification behavior. The remaining evidence must come from final signed/distribution artifacts and representative real targets:\n\n- Android signed package notification permission/delivery/system-settings behavior;\n- iOS signed-device/TestFlight authorization, foreground/background/system presentation, and notification settings;\n- Mac Catalyst signed/notarized sandbox notification authorization/presentation;\n- Windows signed MSIX/package toast/COM registration, activation, clean install/update/uninstall, notification settings, and package identity behavior;\n- accessibility/localization checks for system notification presentation;\n- store/privacy declaration review and final signed-artifact dependency/license/provenance reconciliation.\n\nNotification failure remains deliberately non-authoritative: permission, registration, delivery, presentation, or activation problems cannot change the underlying transfer success/failure state.\n'''
              write(path, stripped + appendix + "\n\n" + BRANDING + "\n")
          PY

      - name: Commit final evidence
        shell: bash
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add PROJECT_STATUS.md NEXT_STEPS.md CHANGELOG.md what_changed.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -s -m "docs(status): finalize native notification evidence"
          git push origin HEAD:main
