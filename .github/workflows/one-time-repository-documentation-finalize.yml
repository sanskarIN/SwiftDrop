name: One-time repository documentation finalize

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-time-repository-documentation-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Synchronize final documentation evidence
        run: python3 scripts/repository_documentation_finalize.py

      - name: Configure commit identity
        run: |
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'

      - name: Commit README verification navigation
        run: |
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -s -m 'docs(readme): reflect documentation verification gate'
          fi

      - name: Commit release checklist documentation gate
        run: |
          if ! git diff --quiet -- docs/release/release-checklist.md; then
            git add docs/release/release-checklist.md
            git commit -s -m 'docs(release): require documentation integrity for candidates'
          fi

      - name: Commit final project status evidence
        run: |
          if ! git diff --quiet -- PROJECT_STATUS.md; then
            git add PROJECT_STATUS.md
            git commit -s -m 'docs(status): record documentation and dependency completion'
          fi

      - name: Commit changelog completion evidence
        run: |
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -s -m 'docs(changelog): record docs enforcement and dependency cleanup'
          fi

      - name: Commit engineering ledger evidence
        run: |
          if ! git diff --quiet -- what_changed.md; then
            git add what_changed.md
            git commit -s -m 'docs(ledger): append final documentation completion evidence'
          fi

      - name: Push focused documentation commits
        run: git push origin HEAD:main
