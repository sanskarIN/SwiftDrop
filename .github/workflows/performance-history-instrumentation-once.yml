name: Performance history instrumentation once

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-performance-history-trigger

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Instrument outgoing timing
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/SwiftDrop.App/MainPage.xaml.cs')
          s = p.read_text()
          def one(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one outgoing match, found {count}: {old[:80]!r}')
              s = s.replace(old, new)
          one('using System.Text;\n', 'using System.Diagnostics;\nusing System.Text;\n')
          one('''        _pauseSingle = false;\n        FileInfo? info = null;\n''', '''        _pauseSingle = false;\n        var stopwatch = Stopwatch.StartNew();\n        FileInfo? info = null;\n''')
          one('''            await _history.AddAsync("sent", remote.DeviceName, info.Name, info.Length, "completed", true);\n''', '''            await _history.AddAsync("sent", remote.DeviceName, info.Name, info.Length, "completed", true, duration: stopwatch.Elapsed);\n''')
          one('''                    "paused",\n                    false);\n''', '''                    "paused",\n                    false,\n                    duration: stopwatch.Elapsed);\n''')
          one('''                    "cancelled",\n                    false);\n''', '''                    "cancelled",\n                    false,\n                    duration: stopwatch.Elapsed);\n''')
          one('''                "failed",\n                false);\n            await DisplayAlert(AppText.Get("TransferFailed"), ex.Message, AppText.Get("Ok"));\n''', '''                "failed",\n                false,\n                duration: stopwatch.Elapsed);\n            await DisplayAlert(AppText.Get("TransferFailed"), ex.Message, AppText.Get("Ok"));\n''')
          one('''        finally\n        {\n            _viewModel.SetSingleTransferControls(sending: false, canResume: _pausedSinglePath is not null);\n''', '''        finally\n        {\n            stopwatch.Stop();\n            _viewModel.SetSingleTransferControls(sending: false, canResume: _pausedSinglePath is not null);\n''')
          one('''        try\n        {\n            _viewModel.TextTransferStatus = AppText.Get("SendingEncryptedText");\n''', '''        var textStopwatch = Stopwatch.StartNew();\n        try\n        {\n            _viewModel.TextTransferStatus = AppText.Get("SendingEncryptedText");\n''')
          one('''                "completed",\n                false);\n            TextSnippetEditor.Text = string.Empty;\n''', '''                "completed",\n                false,\n                duration: textStopwatch.Elapsed);\n            TextSnippetEditor.Text = string.Empty;\n''')
          one('''                "failed",\n                false);\n            _viewModel.TextTransferStatus = AppText.Get("TextTransferFailedStatus");\n''', '''                "failed",\n                false,\n                duration: textStopwatch.Elapsed);\n            _viewModel.TextTransferStatus = AppText.Get("TextTransferFailedStatus");\n''')
          p.write_text(s)
      - name: Commit outgoing timing
        run: |
          git add src/SwiftDrop.App/MainPage.xaml.cs
          git commit -m "feat(performance): record outgoing transfer durations" -m "Signed-off-by: Sanskar <sanskarin@outlook.in>"
      - name: Instrument incoming timing
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/SwiftDrop.App/Services/ReceiveServerService.cs')
          s = p.read_text()
          def one(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one receive match, found {count}: {old[:80]!r}')
              s = s.replace(old, new)
          one('using System.Net.Security;\n', 'using System.Diagnostics;\nusing System.Net.Security;\n')
          one('''    private readonly Func<IncomingTransferPreview, string, bool, CancellationToken, Task>? _recordTransfer;\n''', '''    private readonly Func<IncomingTransferPreview, string, bool, TimeSpan?, CancellationToken, Task>? _recordTransfer;\n''')
          one('''        Func<IncomingTransferPreview, string, bool, CancellationToken, Task>? recordTransfer = null,\n''', '''        Func<IncomingTransferPreview, string, bool, TimeSpan?, CancellationToken, Task>? recordTransfer = null,\n''')
          one('''                await FrameProtocol.WriteJsonAsync(connection, new TransferAcknowledgement(true, offset), ct);\n                await new TransferEngine().ReceiveFileAsync(connection, _receiveRoot, effectiveEntry, offset, null, ct);\n                await FrameProtocol.WriteJsonAsync(connection, new TransferAcknowledgement(true, effectiveEntry.Length), ct);\n                await RecordAsync(filePreview with { Entry = effectiveEntry }, "completed", true, ct);\n''', '''                await FrameProtocol.WriteJsonAsync(connection, new TransferAcknowledgement(true, offset), ct);\n                var transferStopwatch = Stopwatch.StartNew();\n                await new TransferEngine().ReceiveFileAsync(connection, _receiveRoot, effectiveEntry, offset, null, ct);\n                transferStopwatch.Stop();\n                await FrameProtocol.WriteJsonAsync(connection, new TransferAcknowledgement(true, effectiveEntry.Length), ct);\n                await RecordAsync(filePreview with { Entry = effectiveEntry }, "completed", true, ct, transferStopwatch.Elapsed);\n''')
          one('''                try\n                {\n                    await new TransferEngine().ReceiveFileAsync(\n                        connection,\n                        _receiveRoot,\n                        item.EffectiveEntry,\n                        item.ResumeOffset,\n                        null,\n                        ct);\n''', '''                try\n                {\n                    var itemStopwatch = Stopwatch.StartNew();\n                    await new TransferEngine().ReceiveFileAsync(\n                        connection,\n                        _receiveRoot,\n                        item.EffectiveEntry,\n                        item.ResumeOffset,\n                        null,\n                        ct);\n                    itemStopwatch.Stop();\n''')
          one('''                    await RecordAsync(itemPreview, "completed", true, ct);\n''', '''                    await RecordAsync(itemPreview, "completed", true, ct, itemStopwatch.Elapsed);\n''')
          one('''    private Task RecordAsync(IncomingTransferPreview preview, string status, bool verified, CancellationToken ct)\n        => _recordTransfer?.Invoke(preview, status, verified, ct) ?? Task.CompletedTask;\n''', '''    private Task RecordAsync(\n        IncomingTransferPreview preview,\n        string status,\n        bool verified,\n        CancellationToken ct,\n        TimeSpan? duration = null)\n        => _recordTransfer?.Invoke(preview, status, verified, duration, ct) ?? Task.CompletedTask;\n''')
          p.write_text(s)

          p = Path('src/SwiftDrop.App/MainPage.xaml.cs')
          s = p.read_text()
          old = '''    private Task RecordIncomingAsync(IncomingTransferPreview preview, string status, bool verified, CancellationToken ct)\n        => _history.AddAsync("received", preview.SenderDeviceName, preview.Entry.RelativePath, preview.Entry.Length, status, verified, ct);\n'''
          new = '''    private Task RecordIncomingAsync(\n        IncomingTransferPreview preview,\n        string status,\n        bool verified,\n        TimeSpan? duration,\n        CancellationToken ct)\n        => _history.AddAsync(\n            "received",\n            preview.SenderDeviceName,\n            preview.Entry.RelativePath,\n            preview.Entry.Length,\n            status,\n            verified,\n            ct,\n            duration);\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one incoming callback match, found {s.count(old)}')
          p.write_text(s.replace(old, new))
      - name: Commit incoming timing
        run: |
          git add src/SwiftDrop.App/MainPage.xaml.cs src/SwiftDrop.App/Services/ReceiveServerService.cs
          git commit -m "feat(performance): record incoming transfer durations" -m "Signed-off-by: Sanskar <sanskarin@outlook.in>"
      - name: Push focused commits
        run: git push origin HEAD:main
