name: Final audit ledger once

on:
  push:
    branches: [main]
    paths:
      - .github/swiftdrop-final-audit-ledger-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Finalize defect-audit ledger
        run: python3 .github/swiftdrop-final-audit-ledger.py
